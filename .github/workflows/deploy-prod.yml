name: Deploy to Prod
run-name: Deploying ${{ github.sha }} to electrifygame.com 🚀
on:
  push:
    branches: [master]
  workflow_dispatch:

# Never let two prod deploys run at once; queue them instead of cancelling,
# so a half-finished S3 sync is never overwritten by a newer one mid-flight.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: npm

      - name: Fetch and verify public assets
        run: node scripts/ci/lfs-assets.js public

      - run: npm ci

      # Tests are not run here; workflow.yml gates pull requests before merge.

      - name: Configure AWS credentials
        id: hosting-credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
          # Keep publisher credentials out of the intervening Firebase steps.
          output-credentials: true
          output-env-credentials: false

      # Reject missing hosting prerequisites before Firebase or S3 changes.
      # This is read-only; IAM writes are an operator rollout prerequisite.
      - name: Check production hosting readiness
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.hosting-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.hosting-credentials.outputs.aws-secret-access-key }}
          AWS_DEFAULT_REGION: us-east-2
        run: node scripts/hosting/deploy.js --preflight

      # Firestore rules and indexes go out BEFORE the bundle that depends on them.
      # The other order ships a client whose reads the deployed rules still refuse,
      # which fails closed and looks to a player like the game is broken.
      #
      # Refuses to continue without the credential rather than skipping, on the same
      # reasoning as scripts/deploy.sh's REACT_APP_FIREBASE_API_KEY check: a silent skip would
      # leave the rules and the bundle out of step with nothing to say so.
      #
      # The secret is the JSON from Firebase Console -> Project settings ->
      # Service accounts -> Generate new private key, pasted whole.
      # The deployed function's runtime comes from engines.node in firebase/functions/package.json,
      # not from this job's Node. It stays on 24 because firebase-tools 15 only knows nodejs20, 22
      # and 24 (Cloud Run functions has Node 26 in preview). The CLI warns about the mismatch and
      # runs on this job's Node 26; move engines to 26 once firebase-tools accepts it.
      - name: Install mailing-list function dependencies
        run: npm ci --prefix firebase/functions

      - name: Build multiplayer checkpoint validator
        run: node scripts/build-coop-checkpoint-validator.js

      - name: Deploy Firestore and Firebase functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          STEAM_APP_ID: ${{ vars.STEAM_APP_ID }}
          COOP_CHECKPOINT_BUCKET: ${{ vars.COOP_CHECKPOINT_BUCKET }}
          COOP_TURN_RELAY_CIDRS: ${{ vars.COOP_TURN_RELAY_CIDRS }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not set; refusing to deploy prod." >&2
            echo "Add it as a repository secret, or the client will ship against stale rules." >&2
            exit 1
          fi
          # Written outside the workspace so a stray build glob can never sweep a
          # private key into the bundle, and removed even if the deploy fails.
          if [[ ! "$STEAM_APP_ID" =~ ^[1-9][0-9]{0,9}$ ||
                ! "$COOP_CHECKPOINT_BUCKET" =~ ^[a-z0-9][a-z0-9.-]+$ ||
                ! "$COOP_TURN_RELAY_CIDRS" =~ ^[0-9./,[:blank:]]+$ ]]; then
            echo "Set STEAM_APP_ID, COOP_CHECKPOINT_BUCKET, and COOP_TURN_RELAY_CIDRS before deploying co-op." >&2
            exit 1
          fi
          if [[ -e firebase/functions/.env.electrify-game ]]; then
            echo "The production functions environment already exists." >&2
            exit 1
          fi
          key="$(mktemp -d)/firebase-service-account.json"
          trap 'rm -f "$key" firebase/functions/.env.electrify-game' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          printf 'STEAM_APP_ID=%s\nCOOP_CHECKPOINT_BUCKET=%s\nCOOP_TURN_RELAY_CIDRS="%s"\n' \
            "$STEAM_APP_ID" "$COOP_CHECKPOINT_BUCKET" "$COOP_TURN_RELAY_CIDRS" > firebase/functions/.env.electrify-game
          GOOGLE_APPLICATION_CREDENTIALS="$key" \
            npx --yes firebase-tools@15 deploy --only firestore,functions:mailing-list:subscribeMailingList,functions:mailing-list:coopV2,functions:mailing-list:coopV2Reap --non-interactive

      - name: Check co-op service readiness
        run: curl --fail-with-body --retry 4 --silent --show-error https://us-central1-electrify-game.cloudfunctions.net/coopV2/healthz

      - name: Build and deploy to prod
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.hosting-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.hosting-credentials.outputs.aws-secret-access-key }}
          # Baked into the JS bundle at build time by create-react-app.
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_STEAM_APP_ID: ${{ vars.STEAM_APP_ID }}
        run: ./scripts/deploy.sh ci-prod

      - name: Verify deployed SEO pages and hosting
        run: python3 scripts/seo-check.py https://electrifygame.com --hosting
