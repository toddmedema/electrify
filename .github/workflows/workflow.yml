name: Test Code
run-name: Running tests on behalf of ${{ github.actor }} 🚀
# Runs on pull requests only. Tests gate the merge (required status check on
# master), so re-running them on the post-merge commit would only duplicate a
# result we already have -- and slow down the prod deploy.
on:
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the in-flight run's answer obsolete, so drop it.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4.0.2
        with:
          node-version: 24.14.0
          cache: npm

      # ci, not install: installs exactly what package-lock.json pins, so a run
      # can't pass on a dependency tree nobody has locally.
      - run: npm ci

      # Each check runs even if an earlier one failed, so one PR run reports
      # every problem rather than only the first.
      - name: Types
        if: '!cancelled()'
        run: npm run typecheck

      - name: Lint
        if: '!cancelled()'
        run: npm run lint

      - name: Formatting
        if: '!cancelled()'
        run: npm run format:check

      # No --passWithNoTests: if the jest config ever breaks so that no test
      # matches, that should fail the build rather than report success.
      - name: Tests
        if: '!cancelled()'
        run: npm run test:ci

      # The headless simulation asserts the economy's invariants across every
      # scenario. Simulation.test.tsx covers this too, but running the CLI keeps
      # the entry point itself honest.
      - name: Simulation
        if: '!cancelled()'
        run: npm run sim -- --all

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository and media
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js environment
        uses: actions/setup-node@v4.0.2
        with:
          node-version: 24.14.0
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      # Cover purchases, themes, tutorial progression and exit behavior on both
      # phone and desktop without running the entire responsive matrix per PR.
      - name: Browser smoke tests
        run: npm run test:e2e -- build-options.spec.ts tutorial-exit.spec.ts --project=desktop-chromium --project=mobile-390px --workers=2

      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-failures
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
