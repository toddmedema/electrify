name: Test Code
run-name: Running tests on behalf of ${{ github.actor }} 🚀
on:
  # Default-branch runs populate trusted transform caches that every new PR can restore.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark-work:
        description: Measure helper startup, optional review captures and restored transforms
        type: boolean
        default: false
      qa-artifacts:
        description: Archive and upload all three verified offline desktop builds
        type: boolean
        default: false

concurrency:
  group: test-${{ github.ref }}
  # Let a trusted seed finish even when another merge arrives; PR updates still cancel.
  cancel-in-progress: ${{ github.event_name != 'push' }}

# Eight jobs: shared renderers, three native builds, three test workers, and the required gate.
# Tests share renderer artifacts but never wait for an OS build.
jobs:
  build:
    name: Shared production builds
    # Same image as the test workers, which restore the node_modules cache this job can save.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      DISABLE_ESLINT_PLUGIN: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/install
      - uses: ./.github/actions/build-cache
        with:
          edition: desktop
      - name: Compile and verify the shared desktop renderer
        run: npm run desktop:build
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-renderer
          path: |
            build/
            electron/steam-localization.cjs
            electron/achievement-catalog.cjs
          retention-days: 2
          compression-level: 1
          if-no-files-found: error
      - uses: ./.github/actions/build-cache
        with:
          edition: web
      - name: Production web build
        run: npm run build
      - name: Bundle size
        run: npm run perf:bundle
      - uses: actions/upload-artifact@v7
        with:
          name: web-renderer
          path: build/
          retention-days: 2
          compression-level: 1
          if-no-files-found: error

  platform:
    name: ${{ matrix.label }} build
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.tmp/electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.tmp/electron-builder-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-22.04
            platform: linux
            arch: x64
            depot: linux-x64
            directory: linux-unpacked
          - label: Windows x64
            runner: windows-latest
            platform: win32
            arch: x64
            depot: win32-x64
            directory: win-unpacked
          # One universal app serves Intel and Apple Silicon Macs. This Apple Silicon host
          # packages and verifies both slices.
          - label: macOS universal
            runner: macos-15
            platform: darwin
            arch: arm64
            depot: darwin-universal
            directory: mac-universal
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/install
        with:
          profile: desktop
      - name: Restore native packaging downloads
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: desktop-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Require the native host and installed architecture
        shell: bash
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e 'if (process.platform !== process.env.EXPECTED_PLATFORM || process.arch !== process.env.EXPECTED_ARCH) throw new Error("The desktop build must run on its target platform and architecture")'
      - uses: actions/download-artifact@v8
        with:
          name: desktop-renderer
      - name: Package and verify native depot
        run: npm run desktop:pack:offline -- --skip-build --platform ${{ matrix.platform }} --arch ${{ matrix.platform == 'darwin' && 'universal' || matrix.arch }}
      - name: Save native packaging downloads
        if: "!cancelled() && steps.native-cache.outputs.cache-hit != 'true'"
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Archive the complete verified QA depot (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.qa-artifacts
        shell: bash
        run: tar -czf dist/desktop/electrify-offline-qa-${{ matrix.depot }}.tar.gz -C dist/desktop ${{ matrix.directory }}
      - name: Downloadable offline QA build (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.qa-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: electrify-offline-qa-${{ matrix.depot }}
          path: dist/desktop/electrify-offline-qa-${{ matrix.depot }}.tar.gz
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
  cpu:
    name: CPU tests and static checks
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/install
      - uses: ./.github/actions/jest-cache
        with:
          group: unit
          shard: 1
      - uses: ./.github/actions/jest-cache
        with:
          group: simulation
          shard: 1
      - name: Java for the Firestore emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Generate local manifests
        run: npm run compatibility:generate && npm run icons:generate
      - name: All CPU suites, types, lint and formatting
        run: npm run test:ci-all -- --group=cpu
      - name: Measure restored transforms (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark-work
        run: node scripts/ci/benchmark-jest-cache.js > test-results/benchmark-jest-cache.json
      - name: Preserve CPU reports and coverage
        if: always()
        # A failed diagnostics upload must not turn passing tests red.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-cpu
          path: |
            coverage/
            test-results/
            firestore-debug.log
          retention-days: 7
          compression-level: 1
          if-no-files-found: ignore

  browser:
    name: Production browser tests
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/playwright-browsers
      E2E_BUILD_DIR: ${{ github.workspace }}/.tmp/web-renderer
      E2E_PORT: "3189"
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/install
      - name: Cache the locked headless browser
        uses: actions/cache@v6
        with:
          path: .tmp/playwright-browsers
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install graphical system dependencies and headless browser
        run: npx playwright install --with-deps --only-shell chromium
      - name: Generate local manifests
        run: npm run compatibility:generate && npm run icons:generate
      - uses: actions/download-artifact@v8
        with:
          name: web-renderer
          path: .tmp/web-renderer
      - name: Complete production browser matrix
        run: npm run test:ci-all -- --group=browser
      - name: Measure optional review captures (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark-work
        run: npm run test:e2e -- --config=e2e/ci-work.bench.config.ts
      - name: Preserve browser reports and diagnostics
        if: always()
        # A failed diagnostics upload must not turn passing tests red.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-browser
          path: test-results/
          retention-days: 7
          compression-level: 1
          if-no-files-found: ignore

  desktop:
    name: Desktop integration tests
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.tmp/electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.tmp/electron-builder-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/playwright-browsers
      E2E_PORT: "3189"
      ELECTRIFY_EXECUTABLE: ${{ github.workspace }}/dist/desktop/linux-unpacked/Electrify
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/install
      - uses: ./.github/actions/jest-cache
        with:
          group: world-advance
          shard: 1
      - name: Cache native packaging downloads
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: desktop-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Cache the locked headless browser
        uses: actions/cache@v6
        with:
          path: .tmp/playwright-browsers
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install graphical system dependencies and headless browser
        run: npx playwright install --with-deps --only-shell chromium
      - name: Install native window dependencies
        run: sudo apt-get install --yes xvfb openbox
      - name: Generate local manifests
        run: npm run compatibility:generate && npm run icons:generate
      - uses: actions/download-artifact@v8
        with:
          name: desktop-renderer
      - name: Multiplayer, controller and full packaged desktop suites
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" sh -c 'openbox & npm run test:ci-all -- --group=desktop'
      - name: Measure helper startup (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark-work
        run: node scripts/ci/benchmark-world-advance.js "$(find test-results/multiplayer -path '*native-106*1280*/native-world.json' -print -quit)" 48 > test-results/benchmark-world-advance.json
      - name: Preserve desktop reports and diagnostics
        if: always()
        # A failed diagnostics upload must not turn passing tests red.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-desktop
          path: test-results/
          retention-days: 7
          compression-level: 1
          if-no-files-found: ignore

  check:
    name: check
    if: always()
    needs: [build, platform, cpu, browser, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every build and test worker
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
          CPU_RESULT: ${{ needs.cpu.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$PLATFORM_RESULT" = success
          test "$CPU_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$DESKTOP_RESULT" = success
