name: Test Code
run-name: Running tests on behalf of ${{ github.actor }} 🚀
# Runs on pull requests only. Tests gate the merge (required status check on
# master), so re-running them on the post-merge commit would only duplicate a
# result we already have -- and slow down the prod deploy.
on:
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the in-flight run's answer obsolete, so drop it.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the short checks together to avoid paying for a separate install each.
  static:
    name: Static checks and simulation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js environment
        uses: actions/setup-node@v4.0.2
        with:
          node-version: 24.14.0
          cache: npm

      # ci, not install: installs exactly what package-lock.json pins, so a run
      # can't pass on a dependency tree nobody has locally.
      - run: npm ci

      # Each check runs even if an earlier one failed, so one PR run reports
      # every problem rather than only the first.
      - name: Types
        if: "!cancelled()"
        run: npm run typecheck

      - name: Lint
        if: "!cancelled()"
        run: npm run lint

      - name: Formatting
        if: "!cancelled()"
        run: npm run format:check

      # The headless simulation asserts the economy's invariants across every
      # scenario. Simulation.test.tsx covers this too, but running the CLI keeps
      # the entry point itself honest.
      - name: Simulation
        if: "!cancelled()"
        run: npm run sim -- --all

  # Give the CPU-heavy covered suite and production compiler their own runners.
  # Keep Jest coverage in one invocation so all existing thresholds still apply.
  validation:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Tests
            script: test:ci
          - name: Production build
            script: build
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js environment
        uses: actions/setup-node@v4.0.2
        with:
          node-version: 24.14.0
          cache: npm

      - run: npm ci

      # No --passWithNoTests: a broken testMatch must fail, not silently pass.
      - run: npm run ${{ matrix.script }}

  # Playwright starts its own dev server; it does not consume the production build.
  browser:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js environment
        uses: actions/setup-node@v4.0.2
        with:
          node-version: 24.14.0
          cache: npm

      - run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      # Cover purchases, themes, tutorial progression and exit behavior on both
      # phone and desktop without running the entire responsive matrix per PR.
      - name: Browser smoke tests
        run: npm run test:e2e -- build-options.spec.ts tutorial-exit.spec.ts --project=desktop-chromium --project=mobile-390px --workers=2

      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-failures
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Preserve the existing status-check name for branch rules. Run even when a
  # dependency fails or is skipped, and accept only explicit success from all.
  check:
    if: always()
    needs: [static, validation, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          for result in "$STATIC_RESULT" "$VALIDATION_RESULT" "$BROWSER_RESULT"; do
            if [ "$result" != success ]; then
              echo "A required job did not succeed: $result" >&2
              exit 1
            fi
          done
