name: Test Code
run-name: Windows TCP causal investigation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - name: Record host and native alternating comparison
        working-directory: network-probe
        run: |
          New-Item -ItemType Directory -Force results | Out-Null
          python -c "from win_tcp import host_snapshot; import json; print(json.dumps(host_snapshot()))" > results/host.json
          python native_probe.py results/native.json
      - name: Compare default, disabled, restored on the locked browser
        working-directory: network-probe
        run: |
          $chrome = node -p "require('playwright').chromium.executablePath()"
          python chrome_probe.py results/default --chrome $chrome --iterations 1200 --workers 2
          python chrome_probe.py results/disabled --chrome $chrome --feature-mode disable --iterations 1200 --workers 2
          python chrome_probe.py results/restored --chrome $chrome --iterations 1200 --workers 2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-tcp-causal-evidence
          path: |
            network-probe/results/host.json
            network-probe/results/native.json
            network-probe/results/**/result.json
            network-probe/results/**/*-result.json
            network-probe/results/**/*netlog*.json
          retention-days: 14
