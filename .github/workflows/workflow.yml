name: Test Code
run-name: Running tests on behalf of ${{ github.actor }} 🚀
# Runs on pull requests only. Tests gate the merge (required status check on
# master), so re-running them on the post-merge commit would only duplicate a
# result we already have -- and slow down the prod deploy.
on:
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the in-flight run's answer obsolete, so drop it.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# The main gates and native desktop matrix run side by side.
# Within a job, each check runs even if an earlier one failed, so one PR run reports every problem
# rather than only the first. The `check` job at the end is the required status check.
jobs:
  unit:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          lfs: true

      - uses: ./.github/actions/install

      - name: Types
        if: '!cancelled()'
        run: npm run typecheck

      - name: Lint
        if: '!cancelled()'
        run: npm run lint

      - name: Formatting
        if: '!cancelled()'
        run: npm run format:check

      - name: Java for the Firestore emulator
        if: '!cancelled()'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Private achievement security rules
        if: '!cancelled()'
        run: npm run test:rules

      # Jest's cache holds compiled sources and each file's last duration. Without the durations
      # it schedules the smallest files last, whatever they cost. Caches are scoped to the PR, so a
      # later push or re-run restores the previous run's.
      - name: Restore Jest cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/jest-cache
          key: jest-unit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: jest-unit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # Coverage floors apply here. The long simulations live in *.sim.test.tsx and run in the
      # simulation job instead: instrumenting them makes them about half again as slow, and these
      # suites meet the floors without them. No --passWithNoTests: if the jest config ever breaks so
      # that no test matches, that should fail the build rather than report success.
      - name: Tests
        if: '!cancelled()'
        run: npm run test:ci -- --cacheDirectory="$RUNNER_TEMP/jest-cache"

      - name: Save Jest cache
        if: '!cancelled()'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/jest-cache
          key: jest-unit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

  simulation:
    name: Simulation and performance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          lfs: true

      - uses: ./.github/actions/install

      - name: Restore Jest cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/jest-cache
          key: jest-sim-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: jest-sim-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # Economics, balance and golden-output suites. GoldenOutputs runs every scenario the way
      # `npm run sim -- --all` does and fails on any invariant violation.
      - name: Simulation tests
        if: '!cancelled()'
        run: npm run test:sim -- --cacheDirectory="$RUNNER_TEMP/jest-cache"

      - name: Save Jest cache
        if: '!cancelled()'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/jest-cache
          key: jest-sim-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      # One short run keeps the CLI entry point itself honest; the scenario sweep is covered above.
      - name: Simulation CLI
        if: '!cancelled()'
        run: npm run sim -- --scenario 101 --months 12

      # Same-process ratios (Immer overhead, month rollover vs an ordinary tick) cancel runner
      # speed, so they can gate; the milliseconds are reported only. See docs/perf-plan.md.
      # Runs after the tests so nothing else competes for the CPU.
      - name: Tick performance ratios
        if: '!cancelled()'
        run: npm run perf:bench

  browser:
    name: Build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          lfs: true

      - uses: ./.github/actions/install

      - name: Production build
        id: build
        run: npm run build

      # Gzip bytes gate at 10% over the recorded ceilings.
      - name: Bundle size
        if: "!cancelled() && steps.build.outcome == 'success'"
        run: npm run perf:bundle

      - name: Install browser
        id: browser
        if: '!cancelled()'
        run: npx playwright install --with-deps chromium

      # Cover purchases, themes, keyboard dismissal, tutorial progression and exit behavior on both
      # phone and desktop without running the entire responsive matrix per PR.
      - name: Browser smoke tests
        if: "!cancelled() && steps.browser.outcome == 'success'"
        run: npm run test:e2e -- build-options.spec.ts escape-close.spec.ts tutorial-exit.spec.ts cloud-saves.spec.ts menu-keyboard.spec.ts achievements.spec.ts --project=desktop-chromium --project=mobile-390px --workers=2

      # Text can spill into adjacent columns without making the page horizontally scroll.
      - name: Mobile and desktop text layout
        if: "!cancelled() && steps.browser.outcome == 'success'"
        run: npm run test:e2e -- multiline-text.spec.ts modal-layout.spec.ts --project=desktop-chromium --project=mobile-390px --project=mobile-320px --workers=2 --output=test-results/text-layout

      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-failures
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  desktop:
    name: Packaged ${{ matrix.label }} desktop
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            platform: win32
            arch: x64
            directory: win-unpacked
            executable: win-unpacked/Electrify.exe
          - label: Linux x64
            runner: ubuntu-22.04
            platform: linux
            arch: x64
            directory: linux-unpacked
            executable: linux-unpacked/Electrify
          - label: macOS Intel
            runner: macos-15-intel
            platform: darwin
            arch: x64
            directory: mac
            executable: mac/Electrify.app/Contents/MacOS/Electrify
          - label: macOS Apple Silicon
            runner: macos-15
            platform: darwin
            arch: arm64
            directory: mac-arm64
            executable: mac-arm64/Electrify.app/Contents/MacOS/Electrify
    steps:
      - name: Check out repository code and every bundled asset
        uses: actions/checkout@v7
        with:
          lfs: true

      - uses: ./.github/actions/install

      - name: Require the native host and installed architecture
        shell: bash
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e 'if (process.platform !== process.env.EXPECTED_PLATFORM || process.arch !== process.env.EXPECTED_ARCH) throw new Error("The desktop build must run on its target platform and architecture")'

      - name: Install Linux graphical test dependencies
        if: matrix.platform == 'linux'
        run: |
          npx playwright install-deps chromium
          sudo apt-get install --yes xvfb openbox

      - name: Native desktop tests
        run: npm run test:desktop:native

      # This exercises the full depot without Steam credentials. The shipping Steam command
      # additionally requires STEAM_APP_ID and writes it into the packaged configuration.
      - name: Build and verify the offline depot
        id: package
        run: npm run desktop:pack:offline -- --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Fresh-install offline game, display controls and save recovery (Windows and macOS)
        if: matrix.platform != 'linux'
        env:
          ELECTRIFY_EXECUTABLE: ${{ github.workspace }}/dist/desktop/${{ matrix.executable }}
        run: npm run test:desktop

      # A real X server and window manager exercise focus/fullscreen while retaining the
      # renderer sandbox. Ubuntu 22.04 also gives the native depot a conservative glibc host.
      - name: Fresh-install offline game, display controls and save recovery (Linux)
        if: matrix.platform == 'linux'
        env:
          ELECTRIFY_EXECUTABLE: ${{ github.workspace }}/dist/desktop/${{ matrix.executable }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" sh -c 'openbox & npm run test:desktop'

      # Upload a tar archive rather than loose POSIX files: GitHub artifact extraction otherwise
      # loses executable permissions. These are QA builds without Steam IDs or release signing.
      - name: Archive the complete verified QA depot
        id: archive
        shell: bash
        run: tar -czf dist/desktop/electrify-offline-qa-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz -C dist/desktop ${{ matrix.directory }}

      - name: Downloadable offline QA build
        if: "!cancelled() && steps.archive.outcome == 'success'"
        uses: actions/upload-artifact@v7
        with:
          name: electrify-offline-qa-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/desktop/electrify-offline-qa-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          retention-days: 14
          if-no-files-found: error

      - name: Preserve desktop QA diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-smoke-${{ matrix.platform }}-${{ matrix.arch }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The one required status check on master. It passes only when every job above succeeded, so a
  # failed, cancelled or timed-out job blocks the merge.
  check:
    if: '!cancelled()'
    needs: [unit, simulation, browser, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          UNIT: ${{ needs.unit.result }}
          SIMULATION: ${{ needs.simulation.result }}
          BROWSER: ${{ needs.browser.result }}
          DESKTOP: ${{ needs.desktop.result }}
        run: |
          echo "Types, lint and unit tests: $UNIT"
          echo "Simulation and performance: $SIMULATION"
          echo "Build and browser tests:    $BROWSER"
          echo "Packaged desktop matrix:   $DESKTOP"
          [ "$UNIT" = success ] && [ "$SIMULATION" = success ] && [ "$BROWSER" = success ] && [ "$DESKTOP" = success ]
