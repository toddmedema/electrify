<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Resolve browser chrome before stylesheets or the React bundle can delay first paint. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (function () {
        // Scripts run: show the startup entrance below instead of the no-JS summary.
        document.documentElement.classList.add("js");
        let choice;
        try {
          choice = localStorage.getItem("theme");
        } catch (_) {
          // Storage can be unavailable; match the system in that case.
        }
        const mode =
          choice === "light" || choice === "dark"
            ? choice
            : window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = mode;
        document.documentElement.style.colorScheme = mode;
        document
          .querySelector('meta[name="color-scheme"]')
          .setAttribute("content", mode);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", mode === "dark" ? "#121212" : "#ffffff");
      })();
    </script>
    <style>
      /* Match the app canvas while its stylesheet is still loading. */
      html {
        background: var(--bg-primary, #ffffff);
      }
      html[data-theme="dark"] {
        background: var(--bg-primary, #0b1016);
      }
      /* The summary stays in the document for crawlers and readers without scripts. */
      html.js .app-loading {
        display: none;
      }
      /* Lay out the startup entrance before the app stylesheet arrives. */
      #appStartup {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        color: #576574;
        font-family: Inter, sans-serif;
      }
      html[data-theme="dark"] #appStartup {
        color: #9aa9ba;
      }
      #appStartup img {
        max-width: calc(100vw - 48px);
        height: auto;
      }
      .app-loading {
        max-width: 36rem;
        margin: 0 auto;
        padding: 48px 24px;
        color: #17212b;
        font-family: Inter, sans-serif;
        line-height: 1.6;
      }
      html[data-theme="dark"] .app-loading {
        color: #f2f6f9;
      }
      .app-loading a {
        display: inline-block;
        min-height: 44px;
        margin-right: 16px;
        color: #0967b8;
      }
      html[data-theme="dark"] .app-loading a {
        color: #8bc8f8;
      }
    </style>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Electrify — Take charge of the power markets</title>
    <meta
      name="description"
      content="Play Electrify, a free electricity-market strategy game. Build power plants, balance supply and demand, manage costs, and make your grid cleaner."
    />
    <link rel="canonical" href="https://electrifygame.com/" />

    <!-- Bundled typography is also available in an offline desktop build. -->
    <link
      rel="preload"
      href="%PUBLIC_URL%/fonts/inter/InterVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="%PUBLIC_URL%/fonts/inter/inter.css" />

    <!-- Twitter Card data -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@toddmedema" />
    <meta
      name="twitter:title"
      content="Electrify — Take charge of the power markets"
    />
    <meta
      name="twitter:description"
      content="Play Electrify, a free electricity-market strategy game. Build power plants, balance supply and demand, manage costs, and make your grid cleaner."
    />
    <meta name="twitter:creator" content="@ToddMedema" />
    <meta
      name="twitter:image"
      content="https://electrifygame.com/images/gameplay-preview.png"
    />
    <meta
      name="twitter:image:alt"
      content="Electrify gameplay showing power plants, electricity supply and demand, and grid finances"
    />

    <!-- Open Graph data -->
    <meta
      property="og:title"
      content="Electrify — Take charge of the power markets"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Electrify" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://electrifygame.com/" />
    <meta
      property="og:image"
      content="https://electrifygame.com/images/gameplay-preview.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Electrify gameplay showing power plants, electricity supply and demand, and grid finances"
    />
    <meta
      property="og:description"
      content="Play Electrify, a free electricity-market strategy game. Build power plants, balance supply and demand, manage costs, and make your grid cleaner."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://electrifygame.com/#website",
            "url": "https://electrifygame.com/",
            "name": "Electrify"
          },
          {
            "@type": "VideoGame",
            "@id": "https://electrifygame.com/#game",
            "url": "https://electrifygame.com/",
            "name": "Electrify",
            "description": "A free, research-backed strategy game about running an electric utility. Build power plants, balance supply and demand, manage costs, and reduce grid emissions.",
            "image": "https://electrifygame.com/images/gameplay-preview.png",
            "inLanguage": "en",
            "genre": ["Strategy", "Simulation", "Educational"],
            "gamePlatform": "Web browser",
            "isAccessibleForFree": true,
            "license": "https://github.com/toddmedema/electrify/blob/master/LICENSE.md"
          }
        ]
      }
    </script>

    <!-- The installed Android shell can retain the manifest theme_color independently of
         this page's meta tag. Keep its base colors dark too: color_scheme_dark alone
         does not cover every WebAPK/browser. The page still follows the player's theme. -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- App colors -->
    <meta name="msapplication-TileColor" content="#1C1818" />
    <!-- Windows 8 tile -->

    <!-- Add to homescreen for Chrome on Android -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Electrify" />
    <link
      rel="icon"
      sizes="192x192"
      href="%PUBLIC_URL%/images/icon/192x192.png"
    />

    <!-- Add to homescreen for Safari on iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Electrify" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/images/icon/152x152.png" />

    <!-- Tile icon for Win8 (144x144) -->
    <meta
      name="msapplication-TileImage"
      content="%PUBLIC_URL%/images/icon/144x144.png"
    />
  </head>
  <body unresolved class="fullbleed layout vertical center-justified">
    <div id="root" style="width: 100%; height: 100%">
      <main class="app-loading">
        <h1>Electrify</h1>
        <p><strong>Take charge of the power markets.</strong></p>
        <p>
          Build power plants, balance supply and demand, manage costs, and make
          your grid cleaner in a free, research-backed strategy game.
        </p>
        <noscript>
          <p><strong>Enable JavaScript to load and play Electrify.</strong></p>
        </noscript>
        <nav aria-label="About Electrify">
          <a href="%PUBLIC_URL%/about.html">About the game</a>
          <a href="%PUBLIC_URL%/data-centers.html"
            >Data centers and your grid</a
          >
          <a href="%PUBLIC_URL%/privacy.html">Privacy</a>
        </nav>
      </main>
    </div>

    <!-- Installed on web and desktop as soon as scripts run, and removed at the app's first
         commit. Keep the logo geometry in step with MainMenu; both use the same homeLogo
         styles and animation. -->
    <template id="appStartupTemplate">
      <div id="appStartup">
        <div class="appStartupLogo">
          <div class="homeLogo">
            <img alt="Electrify" width="300" height="70" />
            <svg
              class="homeEnergyTrace"
              viewBox="0 0 300 70"
              aria-hidden="true"
              focusable="false"
            >
              <path
                class="homeEnergyPulse"
                d="M57.7873 5.39465C57.7873 5.39465 85.2179 11.978 107.162 11.978C129.107 11.978 150.32 8.22915 150.32 8.22915"
                pathLength="100"
              />
              <g class="homeSmoke">
                <g class="homeSmokePuff">
                  <g class="homeSmokeLift">
                    <circle cx="222" cy="8.1" r="4.4" />
                  </g>
                </g>
                <g class="homeSmokePuff">
                  <g class="homeSmokeLift">
                    <circle cx="222" cy="8.1" r="4.4" />
                  </g>
                </g>
              </g>
            </svg>
          </div>
        </div>
        <div data-startup-status role="status">Starting Electrify…</div>
      </div>
    </template>
    <script>
      (function () {
        const template = document.getElementById("appStartupTemplate");
        const entrance = template.content.cloneNode(true);
        entrance.querySelector("img").src =
          document.documentElement.dataset.theme === "dark"
            ? "%PUBLIC_URL%/images/logo-home-dark.svg"
            : "%PUBLIC_URL%/images/logo-home.svg";
        if (!(
          window.electrifyDesktop && window.electrifyDesktop.apiVersion === 1
        ))
          entrance.querySelector("[data-startup-status]").textContent =
            "Loading Electrify…";
        document.body.append(entrance);
        template.remove();
      })();
    </script>

    <!-- Prefetch low priority assets -->
    <link rel="prefetch" href="%PUBLIC_URL%/data/FuelPricesRaw.csv" />
    <!-- <script async type="text/javascript" src="something.js"></script> -->
  </body>
</html>
