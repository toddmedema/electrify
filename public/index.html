    <!-- Resolve browser chrome before stylesheets or the React bundle can delay first paint. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (function () {
        // Scripts run: show the startup entrance below instead of the no-JS summary.
        document.documentElement.classList.add("js");
        let choice;
        try {
          choice = localStorage.getItem("theme");
        } catch (_) {
          // Storage can be unavailable; match the system in that case.
        }
        const mode =
          choice === "light" || choice === "dark"
            ? choice
            : window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = mode;
        document.documentElement.style.colorScheme = mode;
        document
          .querySelector('meta[name="color-scheme"]')
          .setAttribute("content", mode);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", mode === "dark" ? "#121212" : "#ffffff");
      })();
    </script>
    <style>
      /* Match the app canvas while its stylesheet is still loading. */
      html {
        background: var(--bg-primary, #ffffff);
      }
      html[data-theme="dark"] {
        background: var(--bg-primary, #0b1016);
      }
      /* The summary stays in the document for crawlers and readers without scripts. */
      html.js .app-loading {
        display: none;
      }
      html:not(.js) #appStartup {
        display: none;
      }
      /* Lay out the startup entrance before the app stylesheet arrives. */
      #appStartup {
        position: fixed;
        z-index: 2000;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: safe center;
        align-items: center;
        overflow: auto;
        text-align: center;
        color: #576574;
        background: var(--bg-primary, #ffffff);
        font-family: "Inter", "Segoe UI", Arial, sans-serif;
        line-height: 1.45;
      }
      html[data-theme="dark"] #appStartup {
        color: #9aa9ba;
        background: var(--bg-primary, #0b1016);
      }
      #appStartup .appStartupLogo {
        flex: 0 0 auto;
        box-sizing: border-box;
        width: 100%;
        padding: 32px 24px 0;
      }
      #appStartup .homeLogo {
        position: relative;
        max-width: 680px;
        margin: 0 auto;
      }
      .homeWordmark {
        color: #0084f8;
      }
      html[data-theme="dark"] .homeWordmark {
        color: #629be1;
      }
      #appStartup .homeWordmark {
        display: block;
        width: 100%;
        height: auto;
      }
      #appStartup .homeEnergyTrace {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      /* Reserve the same status space before and after the main stylesheet loads. */
      #appStartup [data-startup-status] {
        flex: 0 0 auto;
        box-sizing: border-box;
        width: 100%;
        max-width: 680px;
        margin: 0 auto;
        padding: 24px;
        font-size: var(--font-size-body1, 0.9375rem);
      }
      @media (max-height: 450px) {
        #appStartup .homeLogo .homeWordmark {
          max-height: 72px;
          object-fit: contain;
        }
      }
      .app-loading {
        max-width: 36rem;
        margin: 0 auto;
        padding: 48px 24px;
        color: #17212b;
        font-family: Inter, sans-serif;
        line-height: 1.6;
      }
      html[data-theme="dark"] .app-loading {
        color: #f2f6f9;
      }
      .app-loading a {
        display: inline-block;
        min-height: 44px;
        margin-right: 16px;
        color: #0084f8;
      }
      html[data-theme="dark"] .app-loading a {
        color: #8bc8f8;
      }
    </style>
