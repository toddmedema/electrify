<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Resolve browser chrome before stylesheets or the React bundle can delay first paint. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (function () {
        let choice;
        try {
          choice = localStorage.getItem("theme");
        } catch (_) {
          // Storage can be unavailable; match the system in that case.
        }
        const mode =
          choice === "light" || choice === "dark"
            ? choice
            : window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = mode;
        document.documentElement.style.colorScheme = mode;
        document
          .querySelector('meta[name="color-scheme"]')
          .setAttribute("content", mode);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", mode === "dark" ? "#121212" : "#ffffff");
      })();
    </script>
    <style>
      /* Match the app canvas while its stylesheet is still loading. */
      html {
        background: var(--bg-primary, #ffffff);
      }
      html[data-theme="dark"] {
        background: var(--bg-primary, #0b1016);
      }
    </style>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Electrify</title>
    <meta
      name="description"
      content="Build power plants, keep the lights on, and make your grid cleaner in a learn-as-you-play strategy game."
    />
    <link rel="canonical" href="https://electrifygame.com/" />

    <!-- Load the complete weight range used by the game and MUI typography. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&amp;display=swap"
    />

    <!-- Twitter Card data -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@toddmedema" />
    <meta
      name="twitter:title"
      content="Electrify: Take Charge of the Power Market"
    />
    <meta
      name="twitter:description"
      content="Build power plants, keep supply equal to demand, manage costs, and reduce grid emissions in a learn-as-you-play strategy game."
    />
    <meta name="twitter:creator" content="@ToddMedema" />
    <meta
      name="twitter:image"
      content="https://electrifygame.com/images/gameplay-preview.png"
    />

    <!-- Open Graph data -->
    <meta
      property="og:title"
      content="Electrify: Take Charge of the Power Market"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://electrifygame.com/" />
    <meta
      property="og:image"
      content="https://electrifygame.com/images/gameplay-preview.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Electrify gameplay showing power plants, electricity supply and demand, and grid finances"
    />
    <meta
      property="og:description"
      content="Build power plants, keep the lights on, and make your grid cleaner."
    />

    <!-- Web Application Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- App colors -->
    <meta name="msapplication-TileColor" content="#1C1818" />
    <!-- Windows 8 tile -->

    <!-- Add to homescreen for Chrome on Android -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Electrify" />
    <link
      rel="icon"
      sizes="192x192"
      href="%PUBLIC_URL%/images/icon/192x192.png"
    />

    <!-- Add to homescreen for Safari on iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta
      name="apple-mobile-web-app-title"
      content="Electrify: Take Charge of the Power Market"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/images/icon/152x152.png" />

    <!-- Tile icon for Win8 (144x144) -->
    <meta
      name="msapplication-TileImage"
      content="%PUBLIC_URL%/images/icon/144x144.png"
    />
  </head>
  <body unresolved class="fullbleed layout vertical center-justified">
    <div id="root" style="width: 100%; height: 100%"></div>

    <noscript id="noscript">
      <p>
        <b
          >JavaScript is currently disabled. You must enable JavaScript to use
          the app and play Electrify.</b
        >
      </p>
      <p>
        <a href="%PUBLIC_URL%/about.html">Learn more about Electrify here</a>
      </p>
    </noscript>

    <!-- Preload front page assets before scripts / css can insert them -->
    <link rel="preload" href="%PUBLIC_URL%/images/logo.svg" as="image" />

    <!-- Prefetch low priority assets -->
    <link rel="prefetch" href="%PUBLIC_URL%/data/FuelPricesRaw.csv" />
    <!-- <script async type="text/javascript" src="something.js"></script> -->
  </body>
</html>
