<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="electrify-steam-app" content="" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>Electrify multiplayer invitation</title>
    <link rel="stylesheet" href="/invite/invite.css" />
    <script defer src="/invite/invite.js"></script>
  </head>
  <body>
    <main>
      <h1>Electrify multiplayer invitation</h1>
      <p id="invalid">
        Open a current invitation from the host to join their game.
      </p>
      <section id="invitation" hidden>
        <p>Choose where to join your friend’s game.</p>
        <div class="actions">
          <a id="web" href="/">Continue in browser</a>
          <a id="steam" hidden>Open in Steam</a>
        </div>
        <label for="invite-code">Paste into Play with friends</label>
        <input type="text" readonly id="invite-code" spellcheck="false" />
      </section>
      <noscript><a href="/">Open Electrify</a></noscript>
    </main>
  </body>
</html>
